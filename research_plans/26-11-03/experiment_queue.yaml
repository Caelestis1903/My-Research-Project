  lambda_default: 0.1
  tau_default: 0.1
  lambda_or_tau_zero_supervised_goal: exact_real_loss_bypass
  rng: SHA256_first8_little_endian_mod_2pow63_minus1_CPU_torch_generator
  rng_key: 'MDMT1103|dataset|seed|epoch|global_step|stream|domain|task'
  rng_exclude: [arm, lambda_mix, tau, kappa]
history:
  H:
    domain_schedule: round_robin_next_present
    tasks_per_probe_domain: 2
    agreement_cosine: 0.2
    kappa_default: 1.0
    geometry: current_adam_preconditioner_sqrt
    max_normals: 4
    gram_dtype: float64
    solver: enumerate_active_subsets_KKT
    pinv_rcond: 0.000000000001
    feasibility_tol: '1e-9 * max(1, norm(h))'
    empty_constraints: identity
    solver_failure: numerical_failure_not_silent_reset
    second_moment: real_gradient_plus_coupled_L2
  T:
    kappa_default: 0.25
    previous_point: previous_step_complete_preupdate_parameters_and_buffers
    same_current_samples_and_indices_at_both_points: true
    correction: 'kappa * beta1 * (1-beta1**(step-1)) * delta_clipped'
    delta_clip: 'delta * min(1, norm(g_shared)/(norm(delta)+1e-12))'
    first_step_delta: 0
    additional_delta_ema: false
    second_moment: current_supervised_gradient_plus_coupled_L2
